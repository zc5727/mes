services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes_dev
      POSTGRES_DB: mes
    ports:
      - "5432:5432"
    volumes:
      - mes_postgres:/var/lib/postgresql/data
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mes_dev
      MINIO_ROOT_PASSWORD: mes_dev_secret
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - mes_minio:/data
volumes:
  mes_postgres:
  mes_minio:
